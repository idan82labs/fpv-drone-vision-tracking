app = "CHANGE_ME"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PACKET_NAME = "tube_hard_negative_review_packet_thr060_top8"
  BASIC_AUTH_USERNAME = "review"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "label_data"
  destination = "/data"
  processes = ["app"]

